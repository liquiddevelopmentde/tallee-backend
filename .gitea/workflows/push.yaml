name: Push Pipeline

on:
  push:
    branches:
      - "development"
      - "main"

jobs:
  test:
    runs-on: ubuntu-latest
    container: nikolaik/python-nodejs:python3.13-nodejs22-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.BOT_TOKEN }}
          ref: ${{ gitea.ref_name }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  format:
    runs-on: ubuntu-latest
    container: nikolaik/python-nodejs:python3.13-nodejs22-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.BOT_TOKEN }}
          ref: ${{ gitea.ref_name }}

      - name: Check code format
        id: check_format
        continue-on-error: true
        run: ruff check app tests

      - name: Format code
        if: steps.check_format.outcome == 'failure'
        run: |
          ruff check --fix app tests
          ruff format app tests

      - name: Commit changes
        env:
          GITEA_TOKEN: ${{ secrets.BOT_TOKEN }}
          BRANCH_NAME: ${{ gitea.ref_name }}
        run: |
          git fetch origin "$BRANCH_NAME"
          git checkout "$BRANCH_NAME"

          if [ -n "$(git status --porcelain app tests)" ]; then
            git config --global user.name "Gitea Actions [bot]"
            git config --global user.email "actions@yannick-weigert.de"
            git add app tests
            git commit -m "Auto-format code [skip ci]"
            git pull --rebase --autostash origin "$BRANCH_NAME"
            git push origin HEAD:$BRANCH_NAME
          else
            echo "No changes to commit"
          fi

      - name: Verify format
        run: ruff check app tests
name: Push Pipeline

on:
  push:
    branches:
      - "development"

jobs:
  format:
    name: "Format code"
    runs-on: ubuntu-latest
    container: nikolaik/python-nodejs:python3.13-nodejs22
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check code format
        id: check_format
        continue-on-error: true
        run: uvx ruff check src tests

      - name: Format code
        if: steps.check_format.outcome == 'failure'
        run: |
          uvx ruff check --fix src tests
          uvx ruff format src tests

      - name: Commit changes
        env:
          GITEA_TOKEN: ${{ secrets.BOT_TOKEN }}
          BRANCH_NAME: ${{ gitea.ref_name }}
        run: |
          git fetch origin "$BRANCH_NAME"
          git checkout "$BRANCH_NAME"

          if [ -n "$(git status --porcelain src tests)" ]; then
            git config --global user.name "Gitea Actions [bot]"
            git config --global user.email "actions@yannick-weigert.de"
            git add src tests
            git commit -m "Auto-format code [skip ci]"
            git pull --rebase --autostash origin "$BRANCH_NAME"
            git push origin HEAD:$BRANCH_NAME
          else
            echo "No changes to commit"
          fi

      - name: Verify format
        run: uvx ruff check src tests

  test:
    name: "Test code"
    needs: format
    runs-on: ubuntu-latest
    container: nikolaik/python-nodejs:python3.13-nodejs22
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build:
    name: "Build Container"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}
          ref: ${{ gitea.ref_name }}

      - name: Build container
        run: docker compose build
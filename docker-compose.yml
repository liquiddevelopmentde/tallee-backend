services:
  app:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      CORS_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
